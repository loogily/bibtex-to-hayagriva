scanning_thermal_microscopy_harnack:
  type: article
  title: >-
    Scanning Thermal Microscopy Method for Self-Heating in Nonlinear Devices and
    Application to Filamentary Resistive Random-Access Memory
  author:
  - Harnack, Nele
  - Rodehutskors, Sophie
  - Gotsmann, Bernd
  date: 2025-02
  page-range: 5342-5352
  url: https://doi.org/10.1021/acsnano.4c12784
  serial-number:
    doi: 10.1021/acsnano.4c12784
    issn: 1936-0851
  abstract: >-
    Devices with a highly nonlinear resistance-voltage relationship are candidates
    for neuromorphic computing, which can be achieved by highly temperature dependent
    processes like ion migration. To explore the thermal properties of such devices,
    Scanning Thermal Microscopy (SThM) can be employed. However, due to the
    nonlinearity, the high resolution and quantitative method of AC-modulated SThM cannot
    readily be used. To this end, an extended nonequilibrium scheme for temperature
    measurement using SThM is proposed, with which the self-heating of nonlinear devices
    is studied without the need for calibrating the tip–sample contact for a specific
    material combination, geometry or roughness. Both a DC and an AC voltage are
    applied to the device, triggering a periodic temperature rise, which enables the
    simultaneous calculation of the tip–sample thermal resistance and the device
    temperature rise. The method is applied to HfO2-based RRAM devices, in which the kinetic
    processes of filamentary switching are governed by temperature. We image
    temperature and propagation of thermal waves and extract properties like the number of
    current filaments, thermal confinement and thermal cross-talk.
  parent:
    type: periodical
    title: ACS Nano
    issue: 5
    volume: 19
  topic: 
  - 02.ab.01
  - 01.af.01
  relevance: 3
  read: false


