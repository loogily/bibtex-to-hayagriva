[package]
name = "bibtex-to-hayagriva"
version = "0.1.0"
edition = "2024"

[dependencies]
hayagriva = "0.10.1"
biblatex = "0.12.0"
serde-saphyr = "2.0.0"
serde = { version = "1.0.229", features = ["derive"] }
regex = "1.13.1"
chrono = "0.4.45"
clap = { version = "4.6.10", features = ["derive"] }

[[bin]]
name = "bibtex-to-hayagriva"
test = false
